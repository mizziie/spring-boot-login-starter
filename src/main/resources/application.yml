spring:
  application:
    name: java-login-starter

  datasource:
    url: jdbc:postgresql://localhost:5432/javalogin
    username: javalogin
    password: javalogin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  session:
    store-type: redis
    timeout: 30m
    redis:
      namespace: java-login:session

server:
  servlet:
    session:
      cookie:
        name: JSESSIONID
        http-only: true
        secure: false
        same-site: lax
      timeout: 30m

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false

app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
    email: ${ADMIN_EMAIL:admin@example.com}
    full-name: ${ADMIN_FULL_NAME:Administrator}
  rate-limit:
    max-attempts: ${RATE_LIMIT_MAX_ATTEMPTS:5}
    attempt-window-seconds: ${RATE_LIMIT_ATTEMPT_WINDOW_SECONDS:300}
    lockout-duration-seconds: ${RATE_LIMIT_LOCKOUT_DURATION_SECONDS:900}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{requestId}] %-5level %logger{36} - %msg%n"
  level:
    org.springframework.security: DEBUG
    com.example.javalogin: DEBUG
